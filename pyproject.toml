[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "photostow"
version = "0.1.0"
description = "Archive exported photos by content hash"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytest",
    "ruff",
    "mypy",
]

[project.scripts]
photostow = "photostow.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.mypy]
python_version = "3.11"
files = ["photostow", "tests"]
show_error_codes = true
pretty = true

[tool.setuptools.packages.find]
include = ["photostow*"]
